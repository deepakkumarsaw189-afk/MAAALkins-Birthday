<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 18th Birthday Tannu 💖</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="book.css">
<link rel="stylesheet" href="animations.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<audio id="bgMusic" loop>
    <source src="assets/music/tuhimera.mp3" type="audio/mpeg">
</audio>

<section id="hero">

```
<div class="hero-content">

    <img
    src="assets/images/chibi-girl-heart.png"
    class="hero-girl"
    alt="Birthday Girl">

    <h1>
        Happy 18th Birthday
        <span>Tannu 💖</span>
    </h1>

    <p>
        A little storybook made with love 🌸
    </p>

    <button id="startBtn">
        Open Your Story 📖
    </button>

</div>
```

</section>

<section id="storybook">

```
<div class="book-container">

    <div class="book">

        <div class="page cover-page">
            <img src="assets/images/book-cover.png">
        </div>

        <div class="page">
            <img src="assets/images/page1.png">
        </div>

        <div class="page">
            <img src="assets/images/page2.png">
        </div>

        <div class="page">
            <img src="assets/images/page3.png">
        </div>

        <div class="page">
            <img src="assets/images/page4.png">
        </div>

        <div class="page">
            <img src="assets/images/EndingPage5.png">
        </div>

    </div>

</div>

<div class="book-controls">

    <button id="prevBtn">⬅</button>

    <span id="pageCounter">
        Page 0 / 5
    </span>

    <button id="nextBtn">➡</button>

</div>
```

</section>

<section id="finale">

```
<div class="finale-content">

    <img
    src="assets/images/chibi-crown.png"
    class="final-crown">

    <h2>
        Happy 18th Birthday Tannu 🎂💖
    </h2>

    <p>
        Welcome To Adulthood 🌸
    </p>

</div>
```

</section>

<canvas id="fireworksCanvas"></canvas>

<button id="musicBtn">🎵</button>

<script src="main.js"></script>

<script src="book.js"></script>

<script src="effects.js"></script>

</body>
</html>
